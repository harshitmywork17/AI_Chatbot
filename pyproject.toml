[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "^/li/"

[tool.isort]
profile = "black"
line_length = 100
skip = ["li"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["li"]
